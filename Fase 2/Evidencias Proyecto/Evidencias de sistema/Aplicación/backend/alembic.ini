# Configuración de Alembic (migraciones del esquema de la base de datos).
# La URL de la base NO va aquí: se toma de DATABASE_URL (ver app/config.py),
# igual que la aplicación. Uso, desde la carpeta backend:
#   python scripts/migrar.py            (recomendado: lo hace iniciar.bat)
#   python -m alembic upgrade head      (aplicar migraciones pendientes)
#   python -m alembic revision --autogenerate -m "descripcion"   (nueva migración)

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
